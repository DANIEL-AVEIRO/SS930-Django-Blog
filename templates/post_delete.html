{% extends 'layouts/base.html' %}

{% block title %}Post Update{% endblock %}

{% block main %}


<div class="card" style="max-width: 560px;margin-inline: auto;">
    <div class="card-header bg-danger">
        <div class="d-flex justify-content-center align-items-center">
            <h3 class="card-title mb-0 text-center text-white">Post Delete</h3>
        </div>
    </div>
    <div class="card-body">
        <form class="row">
            <div class="card">
                <div class="card-body">
                    <p class="card-text mb-0">Are you sure to delete {{post.title}}</p>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-danger">Submit</button>
                    <a href="{% url 'post_list' %}" class="btn btn-outline-dark">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
