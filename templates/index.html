{% extends 'layouts/base.html' %}
{% load static %}
{% block title %}Home{% endblock %}

{% block main %}

<div class="card">
    <div class="card-header">
        <h3 class="card-title mb-0 text-center">Our Posts</h3>
    </div>
    <div class="card-body">
        <div class="row">
            <!-- card start -->
            {% for post in posts %}
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">{{post.title}}</h5>
                    </div>
                    <div class="card-body">
                        {% if post.image %}
                        <img class="card-img" src="{{post.image.url}}">
                        {% else %}
                        <img class="card-img" src="{% static 'images/placeholder.png' %}">
                        {% endif %}
                        <p class="card-text mb-2">{{post.content}}</p>
                        <p class="text-muted mb-0">{{post.created_at}}</p>
                    </div>
                    <div class="card-footer">
                        <a href="#" class="btn btn-dark">View More</a>
                    </div>
                </div>
            </div>
            {% endfor %}
            <!-- card end -->
        </div>
    </div>
</div>

{% endblock %}
