{% extends 'layouts/base.html' %}

{% block title %}Post Update{% endblock %}

{% block main %}


<div class="card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0 text-center">Post Update</h3>
            <a href="{% url 'post_list' %}" class="btn btn-dark">Go Back</a>
        </div>
    </div>
    <div class="card-body">
        <form class="row">
            <div class="mb-3 col-12">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" placeholder="Enter post title">
            </div>
            <div class="mb-3 col-12">
                <label class="form-label">Image</label>
                <input type="file" class="form-control">
            </div>
            <div class="mb-3 col-12">
                <label class="form-label">Content</label>
                <textarea rows="10" class="form-control" placeholder="Enter post content"></textarea>
            </div>
            <div class="mb-3 col-12">
                <button type="submit" class="btn btn-dark">Submit</button>
                <a href="{% url 'post_list' %}" class="btn btn-outline-dark">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
