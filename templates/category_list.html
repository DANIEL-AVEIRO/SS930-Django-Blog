{% extends 'layouts/base.html' %}
{% load static %}
{% block title %}Category List{% endblock %}

{% block main %}

<div class="card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0 text-center">Category List</h3>
            <a href="{% url 'category_create' %}" class="btn btn-dark">+ Add New Category</a>
        </div>
    </div>
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <th scope="row">{{forloop.counter}}</th>
                    <td>{{category.name}}</td>
                    <td>
                        <a href="{% url 'category_update' category.id %}" class="btn btn-warning">Update</a>
                        <a href="{% url 'category_delete' category.id %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
